service: edurain-api

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-south-1
  environment:
    DATABASE_URL: ${env:DATABASE_URL, ''}
    RAZORPAY_KEY_ID: ${env:RAZORPAY_KEY_ID, ''}
    RAZORPAY_KEY_SECRET: ${env:RAZORPAY_KEY_SECRET, ''}

functions:
  api:
    handler: dist/lambda.handler
    events:
      - httpApi: '*'
